<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0c0708" />
  <meta name="robots" content="noindex" />
  <title>OPUS MARKET</title>
  <link rel="icon" type="image/png" href="../icons/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=9" />
  <script>
    // Mavzu: saqlangan tanlov yoki telefon sozlamasi (birinchi chizishdan oldin — miltillamasin)
    (function () {
      var t = null; try { t = JSON.parse(localStorage.getItem("opus_app_theme")); } catch (e) {}
      if (!t || t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    /* Kirish animatsiyasi — native splash'ning davomi (fon #0c0708, markazda logo) */
    #intro { position: fixed; inset: 0; z-index: 9999; background: radial-gradient(120% 80% at 50% 45%, #2a0a10 0%, #0c0708 60%); display: grid; place-items: center; transition: opacity .5s ease, transform .5s ease; }
    #intro.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
    #intro .in-box { position: relative; display: flex; flex-direction: column; align-items: center; }
    #intro .in-logo { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
    #intro .in-logo img { width: 104px; height: 104px; border-radius: 26px; animation: inPop .7s cubic-bezier(.2,1.4,.4,1) both; box-shadow: 0 0 0 0 rgba(225,15,42,.6); }
    #intro .in-logo svg { position: absolute; inset: -10px; width: 152px; height: 152px; transform: rotate(-90deg); }
    #intro .in-logo circle { fill: none; stroke: #e10f2a; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 440; stroke-dashoffset: 440; animation: inRing .9s .15s ease-out forwards; filter: drop-shadow(0 0 6px #e10f2a); }
    #intro .in-glow { position: absolute; top: -44px; left: 50%; margin-left: -110px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(225,15,42,.35), transparent 65%); animation: inPulse 1.6s ease-in-out infinite; }
    #intro .in-word { margin-top: 26px; font: 800 22px/1 Orbitron, Inter, sans-serif; letter-spacing: .18em; color: #fff; display: flex; }
    #intro .in-word span { opacity: 0; transform: translateY(10px); animation: inChar .45s ease-out forwards; }
    #intro .in-word .r { color: #ff2d4a; }
    #intro .in-bar { margin-top: 22px; width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
    #intro .in-bar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #e10f2a, #ff6b81); animation: inLoad 1s ease-in-out infinite; }
    @keyframes inPop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes inRing { to { stroke-dashoffset: 0; } }
    @keyframes inPulse { 0%,100% { transform: scale(.9); opacity: .6; } 50% { transform: scale(1.1); opacity: 1; } }
    @keyframes inChar { to { opacity: 1; transform: none; } }
    @keyframes inLoad { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #intro *, #intro { animation: none !important; transition: none !important; } #intro .in-word span { opacity: 1; transform: none; } #intro .in-logo circle { stroke-dashoffset: 0; } }
  </style>
</head>
<body>
  <div id="intro" aria-hidden="true">
    <div class="in-box">
      <div class="in-glow"></div>
      <div class="in-logo"><svg viewBox="0 0 152 152"><circle cx="76" cy="76" r="70"/></svg><img src="../icons/icon-192.png" alt="" /></div>
      <div class="in-word"><span class="r" style="animation-delay:0.35s">O</span><span class="r" style="animation-delay:0.39s">P</span><span class="r" style="animation-delay:0.43s">U</span><span class="r" style="animation-delay:0.47s">S</span><span style="animation-delay:0.51s">&nbsp;</span><span style="animation-delay:0.55s">M</span><span style="animation-delay:0.59s">A</span><span style="animation-delay:0.63s">R</span><span style="animation-delay:0.67s">K</span><span style="animation-delay:0.71s">E</span><span style="animation-delay:0.75s">T</span></div>
      <div class="in-bar"><i></i></div>
    </div>
  </div>
  <script>
    // Har ishga tushishda bir marta; sahifa qayta yuklansa ko'rsatilmaydi
    window.__introT = performance.now();
    try { if (sessionStorage.getItem("opus_intro")) document.getElementById("intro").remove(); sessionStorage.setItem("opus_intro", "1"); } catch (e) {}
  </script>
  <div id="stage"></div>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="active"><svg viewBox="0 0 24 24"><path d="M12 3l9 7.5V21h-6.5v-6h-5v6H3V10.5z"/></svg><span>Bosh sahifa</span></button>
    <button data-tab="catalog"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 015.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z"/></svg><span>Katalog</span></button>
    <button data-tab="cart"><svg viewBox="0 0 24 24"><path d="M7 18a2 2 0 110 4 2 2 0 010-4zm10 0a2 2 0 110 4 2 2 0 010-4zM1 2h3.3l1 2H21a1 1 0 011 1.2l-1.6 8A2 2 0 0118.4 15H8.1l-.9 1.6V17H19v2H7a2 2 0 01-1.8-2.9l1.4-2.6L3.1 4H1V2z"/></svg><span>Savat</span><i class="tb-badge" id="cartBadge" hidden></i></button>
    <button data-tab="fav"><svg viewBox="0 0 24 24"><path d="M12 21l-1.5-1.3C5.4 15.1 2 12 2 8.2 2 5.1 4.4 2.7 7.5 2.7c1.7 0 3.4.8 4.5 2.1a6 6 0 014.5-2.1c3.1 0 5.5 2.4 5.5 5.5 0 3.8-3.4 6.9-8.5 11.5z"/></svg><span>Saralangan</span><i class="tb-badge" id="favBadge" hidden></i></button>
    <button data-tab="profile"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4.4 0-9 2.2-9 5.5V22h18v-2.5c0-3.3-4.6-5.5-9-5.5z"/></svg><span>Kabinet</span></button>
  </nav>

  <div class="sheet-bg" id="sheetBg" hidden></div>
  <div class="sheet" id="sheet" hidden><div class="sheet-grip"></div><div id="sheetBody"></div></div>
  <div class="toasts" id="toasts"></div>

  <script src="../assets.js?v=26"></script>
  <script src="../data.js?v=26"></script>
  <script src="../sfx.js?v=29"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
