<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- OPUS AI: OPUS logotipi (qizil kvadrat + oq halqa + nuqta) asosida — halqa ichida "sun'iy intellekt yadrosi", nuqta o'rnida uchqun -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3a4e"/>
      <stop offset=".55" stop-color="#c50c2a"/>
      <stop offset="1" stop-color="#5a0b6e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#9ff0ff"/>
      <stop offset=".75" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#4b1bd6"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe1e8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <!-- Neyron tarmoq chiziqlari -->
  <g stroke="#ffffff" stroke-opacity=".28" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M18 96 L34 84 L44 86"/>
    <path d="M14 58 L28 58 L36 50"/>
    <path d="M100 104 L92 94 L84 92"/>
    <path d="M110 70 L98 70 L92 76"/>
  </g>
  <g fill="#ffffff" fill-opacity=".45">
    <circle cx="18" cy="96" r="3"/><circle cx="14" cy="58" r="3"/><circle cx="100" cy="104" r="3"/><circle cx="110" cy="70" r="3"/>
  </g>
  <circle cx="64" cy="66" r="44" fill="url(#glow)"/>
  <!-- OPUS halqasi -->
  <circle cx="64" cy="66" r="29" fill="none" stroke="url(#ring)" stroke-width="12"/>
  <!-- AI yadrosi -->
  <circle cx="64" cy="66" r="13" fill="url(#core)"/>
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity=".9">
    <path d="M64 58v4M64 70v4M56 66h4M68 66h4"/>
  </g>
  <circle cx="64" cy="66" r="2.6" fill="#ffffff"/>
  <!-- Logotipdagi nuqta o'rnida — uchqun -->
  <path d="M94 22 C95.6 30 98 32.4 106 34 C98 35.6 95.6 38 94 46 C92.4 38 90 35.6 82 34 C90 32.4 92.4 30 94 22 Z" fill="#ffffff"/>
  <path d="M108 46 C108.6 49 109.6 50 112.6 50.6 C109.6 51.2 108.6 52.2 108 55.2 C107.4 52.2 106.4 51.2 103.4 50.6 C106.4 50 107.4 49 108 46 Z" fill="#ffffff" fill-opacity=".85"/>
  <rect width="128" height="128" rx="30" fill="url(#gloss)"/>
</svg>
